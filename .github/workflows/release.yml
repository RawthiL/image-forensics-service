# Build and publish the service images to GitHub Container Registry.
#
# - Release published (tag vX.Y.Z): test, then push
#     ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y, :latest          (CPU build)
#     ghcr.io/<owner>/<repo>:X.Y.Z-gpu, :X.Y-gpu, :latest-gpu
#   Pre-releases skip the :X.Y / :latest moving tags.
#
# Four images per release. The lean ONNX runtime is the unsuffixed default:
#     :X.Y.Z            ONNX Runtime, CPU   (~589 MB)
#     :X.Y.Z-onnx-gpu   ONNX Runtime, CUDA
#     :X.Y.Z-triton     Triton client, no local runtime  (~489 MB)
#     :X.Y.Z-torch      torch, CPU          (~1.7 GB)
#     :X.Y.Z-torch-gpu  torch, CUDA         (~9.2 GB)
# Use the -triton image when inference runs on a Triton server you operate.
# - Manual run (Actions tab -> "Release image" -> Run workflow): test, then push
#     :<branch> and :sha-<short> (plus -gpu) for trying an unreleased build.
#
# The CPU build is the unsuffixed default: this detector runs acceptably on
# commodity CPU, so most suppliers will not have a GPU.
#
# Images contain code only (MIT). Model weights are never baked in -- operators
# fetch them through the catalog or mount their own (see README "Model
# licensing"). No config.yaml is baked in either; the service requires one to
# be mounted and refuses to start without it.
name: Release image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Release tag matches project version
        if: github.event_name == 'release'
        run: |
          project_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::release tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${project_version}'"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.2.0  # publishes full version tags only (no moving v10)
        with:
          enable-cache: true

      - name: Lock is current
        run: uv lock --check

      - name: Install
        run: >
          uv sync --locked --extra cpu --extra community-forensics
          --extra onnx-cpu --extra onnx-export --extra dev

      - name: Export the ONNX artifact
        # Produces weights/onnx/*.onnx so the runtime-parity tests run for real
        # rather than skipping. The export verifies itself against the torch
        # checkpoint and fails if they disagree.
        run: |
          uv run python -m ifs.detectors.backends.community_forensics.export \
            --model commfor-384 --out-dir ./weights
          # torch's dynamo exporter writes weights externally by default; a
          # sidecar here means the Triton repository copy has no weights.
          if [ -f weights/onnx/commfor-384.onnx.data ]; then
            echo "::error::export produced external weights; the artifact must be self-contained"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest

      - name: OpenAPI spec is up to date
        run: |
          uv run python scripts/export_openapi.py
          if ! git diff --quiet -- docs/openapi.json; then
            echo "::error::docs/openapi.json is stale; run 'uv run python scripts/export_openapi.py' and commit the result"
            git --no-pager diff -- docs/openapi.json
            exit 1
          fi

      - name: Every deployment target resolves
        run: |
          for extra in cpu cu124; do
            echo "::group::linux/amd64 --extra $extra"
            uv pip compile --quiet --python-platform x86_64-unknown-linux-gnu \
              --python-version 3.12 --extra "$extra" --extra community-forensics \
              pyproject.toml | grep -E '^(torch|torchvision)=='
            echo "::endgroup::"
          done

  publish:
    name: Build and push ${{ matrix.target }} image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # sign the provenance attestation
      attestations: write
    strategy:
      fail-fast: false      # a CUDA build failure must not bury a good CPU image
      matrix:
        include:
          # The lean ONNX runtime is the unsuffixed default: same scores as
          # torch, ~589 MB against 1.7 GB / 9.2 GB.
          - target: onnx
            flavor: ""
          - target: onnx-gpu
            flavor: "suffix=-onnx-gpu,onlatest=true"
          # Remote inference on an existing Triton: no model runtime at all.
          - target: triton
            flavor: "suffix=-triton,onlatest=true"
          - target: cpu
            flavor: "suffix=-torch,onlatest=true"
          - target: gpu
            flavor: "suffix=-torch-gpu,onlatest=true"
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry refs must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Free disk space
        if: matrix.target == 'gpu' || matrix.target == 'onnx-gpu'
        # CUDA wheels are ~2.5GB unpacked and the runner ships ~25GB of
        # preinstalled toolchains we never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            ${{ matrix.flavor }}
            latest=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=image-forensics-service (${{ matrix.target }})
            org.opencontainers.image.description=AI-generated image detection behind an OpenAPI plus Sightengine- and Hive-compatible layers (Pocket Network backend)
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Smoke test the pushed image
        # Starts with the stub backend so no weights are fetched: this proves
        # the image boots, reads a config and serves, not that a model works.
        run: |
          mkdir -p /tmp/ci-config
          printf 'detector:\n  backend: stub\n  model: stub-v1\n' > /tmp/ci-config/config.yaml
          docker run -d --name ifs-smoke -p 8000:8000 \
            -v /tmp/ci-config:/etc/ifs:ro \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz; then ok=1; break; fi
            sleep 2
          done
          if [ -z "${ok:-}" ]; then
            echo "::error::image did not become ready"
            docker logs ifs-smoke
            exit 1
          fi
          curl -fsS http://localhost:8000/healthz
          docker rm -f ifs-smoke

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
